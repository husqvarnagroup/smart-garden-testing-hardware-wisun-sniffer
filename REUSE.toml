version = 1

# Tool configuration copied verbatim from the Zephyr Project (v4.2.1), so that this repository is
# formatted and checked exactly as upstream is. Annotated here rather than by editing the files to
# keep the diff empty.
[[annotations]]
path = [
  ".checkpatch.conf",
  ".clang-format",
  ".editorconfig",
  ".gitlint",
  ".ruff.toml",
  ".yamllint",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) The Zephyr Project contributors"
SPDX-License-Identifier = "Apache-2.0"

# Output generated by tools has no copyright
[[annotations]]
path = [
  "application/wisun_sniffer/src/ext/radio_config_wisun.h",
  "uv.lock",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
