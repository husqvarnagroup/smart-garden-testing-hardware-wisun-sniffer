description: Silicon Labs Si4467 Sub-GHz transceiver

compatible: "silabs,si4467"

include: spi-device.yaml

properties:
  nirq-gpios:
    type: phandle-array
    required: true
    description: Interrupt pin.

      The interrupt pin nIRQ of Si4467 is active low input on the MCU.

  nirq-handling-gpios:
    type: phandle-array
    required: false
    description: Optional pin to analyze time spent handling the nIRQ.

  cca-in-progress-gpios:
    type: phandle-array
    required: false
    description: Optional pin to analyze time spent doing clear channel assessments.

  sdn-gpios:
    type: phandle-array
    required: true
    description: Shutdown pin.

      The shutdown (SDN) pin of Si4467 is active high.

  gpio-0-gpios:
    type: phandle-array
    required: false
    description: Si4467 GPIO 0, used for CCA

  gpio-1-gpios:
    type: phandle-array
    required: false
    description: Si4467 GPIO 1, reserved for later use.

  gpio-2-gpios:
    type: phandle-array
    required: false
    description: Si4467 GPIO 2

  gpio-3-gpios:
    type: phandle-array
    required: false
    description: Si4467 GPIO 3

  xtal-frequency:
    type: int
    required: true
    description: Clock frequency of XTAL in Hz

  xtal-capacitor-tune-value:
    type: int
    required: false
    description: >-
      Clock crystal capacitor tune value.

      This controls the capacitance of the internal capacitors for the crystal oscillator. The
      range is from 0 to 0x7f inclusive and each LSB step corresponds to ~70 fF change in
      capacitance. The ideal value must be determined experimentally and it can be left blank if
      individual calibration per device is used.

  rx-enable-gpios:
    type: phandle-array
    required: false
    description: RX enable pin. Controls the TX/RX switch.

  tx-enable-gpios:
    type: phandle-array
    required: false
    description: TX enable pin. Controls the TX/RX switch.

  rx-rssi-offset:
    type: int
    required: false
    description: >-
      RSSI offset in RX path due to analog front-end. Subtracted from RSSI
      value as reported by the Si4467 transceiver to get corrected value.
