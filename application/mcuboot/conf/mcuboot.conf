#
# The part of the MCUboot configuration that is not specific to a board; boards/ holds the rest.
# See README.md for the command; MCUboot itself is built from bootloader/mcuboot/boot/zephyr with
# these fragments passed in.

CONFIG_MULTITHREADING=y

# No image signature is verified, so there is no signing key anywhere in this repository.
#
# The dongle is not a product. It enters DFU mode only while its button is held during reset, so
# loading firmware onto one already needs physical access and a signature would add nothing.
# CONFIG_BOOT_VALIDATE_SLOT0 stays on regardless, so the image's SHA256 is still checked before it
# is booted -- what is given up is proof of who built the image, not detection of a corrupt one.
#
# A product board would set CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256 here instead, point
# CONFIG_BOOT_SIGNATURE_KEY_FILE at a key, and build the application against a matching
# CONFIG_MCUBOOT_SIGNATURE_KEY_FILE rather than CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Reduces MCUboot image size by about 9k compared with a binary compiled with CONFIG_DEBUG_OPTIMIZATIONS=y (default)
CONFIG_SIZE_OPTIMIZATIONS=y

# Reduces MCUboot image size by about 9k compared with a binary compiled with CONFIG_ADC=y (default)
CONFIG_ADC=n

# Set MCUboot log level to inf saves ~500 bytes
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
