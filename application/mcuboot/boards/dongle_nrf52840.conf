# dongle/nrf52840 board specific configuration which does not depend on build type.

# Only one application slot (no fallback needed)
CONFIG_SINGLE_APPLICATION_SLOT=y

# Enable USB DFU when the user button is pushed during power-on or during reset.
CONFIG_BOOT_USB_DFU_GPIO=y

# Enable LED to indicate when device is in DFU mode.
CONFIG_MCUBOOT_INDICATION_LED=y

# Disable USB init at boot. MCUboot main() calls usb_enable() and fails with -EALREADY if Zephyr
# already initialized USB.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Enable permanent download & reboot after download.
CONFIG_USB_DFU_PERMANENT_DOWNLOAD=y
CONFIG_USB_DFU_REBOOT=y

# Enable console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
