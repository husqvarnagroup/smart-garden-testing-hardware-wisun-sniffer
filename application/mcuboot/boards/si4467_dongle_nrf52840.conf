# si4467_dongle/nrf52840 board specific configuration which does not depend on build type.

# Only one application slot (no fallback needed)
CONFIG_SINGLE_APPLICATION_SLOT=y

# Enable USB DFU when the user button is pushed during power-on or during reset.
CONFIG_BOOT_USB_DFU=y
CONFIG_BOOT_USB_DFU_GPIO=y

# MCUboot points the DFU backend at slot 1, which a single slot layout does not have; without slot 0
# DFU mode enumerates with nothing to write to.
CONFIG_USBD_DFU_FLASH_SLOT0=y

# Same identity in DFU mode as the board's defaults for an application.
CONFIG_BOOT_USB_DFU_VID=0x1915
CONFIG_BOOT_USB_DFU_PID=0xB820
CONFIG_BOOT_USB_DFU_MANUFACTURER_STRING="Gardena"
CONFIG_BOOT_USB_DFU_PRODUCT_STRING="Si4467 Dongle"

# Enable LED to indicate when device is in DFU mode.
CONFIG_MCUBOOT_INDICATION_LED=y

# The board's console is a CDC ACM interface, which MCUboot's DFU-only USB device never registers.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
