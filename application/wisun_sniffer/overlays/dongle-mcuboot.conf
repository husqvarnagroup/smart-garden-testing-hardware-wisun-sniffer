# Configure MCUboot support
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y

# The image carries an MCUboot header and a SHA256, but no signature: nothing in this workspace
# verifies one. The bootloader is built with CONFIG_BOOT_SIGNATURE_TYPE_NONE, because entering DFU
# mode already needs physical access to the dongle's button, so a key here would be checked by
# nobody. CONFIG_BOOT_VALIDATE_SLOT0 still holds, and the SHA256 is what it validates.
#
# The header is imgtool's work, not the key's -- this pairing is how imgtool is asked to add one
# without signing. An empty key file on its own means "sign it yourself", and produces no image.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y

CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_SHELL=y

# The image manager reaches the slot through the flash map. The application itself keeps nothing in
# flash, so unlike the other dongle applications it does not enable the flash driver on its own.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# We use only one application partition
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
