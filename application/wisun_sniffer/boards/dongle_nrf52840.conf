# Distinguish this dongle from the other firmware variants when it enumerates.
# In use so far: B820 (board default), B821 & B822 (other firmwares).
CONFIG_USB_DEVICE_PID=B823
CONFIG_USB_DEVICE_PRODUCT="Wi-SUN Sniffer Dongle"

# A Wi-SUN PSDU may be up to 2047 bytes; the default 1024 byte ring buffer would drop data on the
# capture interface for large frames. Four times the largest frame rather than twice it, because
# this buffer sits behind the application's own staging buffer and a frame that reaches it has
# already been counted as captured -- losing it here would not show up in the drop counter.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192

# The console is a USB CDC ACM interface, so it does not exist yet when the application starts.
# Hold back log processing until the host has had time to enumerate, otherwise every startup
# message (including transceiver bring-up failures) is lost before anyone can read it.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
