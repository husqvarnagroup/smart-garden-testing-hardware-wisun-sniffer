# src/usb.c registers both CDC ACM interfaces; the board's serial backend would register only the
# first.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# The console is a USB CDC ACM interface, so it does not exist yet when the application starts.
# Hold back log processing until the host has had time to enumerate, otherwise every startup
# message (including transceiver bring-up failures) is lost before anyone can read it.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000

# Shell output is not held back until a reader raises DTR on the console; tools/ expect the startup
# log to be waiting when they open it.
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
