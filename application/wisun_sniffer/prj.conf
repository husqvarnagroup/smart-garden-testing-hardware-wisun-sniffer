# No IP stack is needed: frames go straight from the transceiver to the capture UART.
CONFIG_NETWORKING=n

# Transceiver interface
CONFIG_SPI=y
CONFIG_GPIO=y

# The nIRQ interrupt hands off to the receive thread through a kernel event object.
CONFIG_EVENTS=y

# Console, logging and shell (on cdc_acm_uart0, see boards/dongle_nrf52840.overlay)
CONFIG_LOG=y
CONFIG_SHELL=y

# Lets the receive path be traced with "log enable dbg si4467_wisun" at the shell, which is far
# quicker than reflashing when a frame does not come out the way it should.
CONFIG_LOG_RUNTIME_FILTERING=y

# Needed to detect when a capture tool opens the capture UART, so the PCAP-NG section header can be
# re-sent for hosts that attach long after boot.
CONFIG_UART_LINE_CTRL=y

# A plain build starts at the reset vector, so a bare dongle can be flashed with a debug probe and
# nothing else. overlays/dongle-mcuboot.conf builds the same application to load through MCUboot
# instead, which is what a dongle handed out to someone else should carry.
CONFIG_BOOTLOADER_MCUBOOT=n

# This is a diagnostic tool, not a product: keep the safety nets on.
CONFIG_ASSERT=y

# Stacks, all of them above what this application has been measured to need, because none of it
# has been measured. The dongle has 256 KB of RAM and uses a third of it, so the choice is between
# memory nobody will miss and a class of fault that presents as a dongle which has simply stopped.
# CONFIG_HW_STACK_PROTECTION turns an overflow into a message rather than silent corruption, but
# only if the stack is where the guard is; it does not make a stack that is too small correct.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_ISR_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512

# The log thread formats the per-frame line, and under load it formats one per frame while the
# receive path is busy. It is also the thread that has to keep running when something has gone
# wrong enough to be worth logging.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=3072
