source [find interface/ftdi/olimex-arm-jtag-swd.cfg]
# openocd releases up to 0.12 and Zephyr's fork have the flat layout, later ones target/nordic/.
if {[catch {find target/nordic/nrf52.cfg}]} {
	source [find target/nrf52.cfg]
} else {
	source [find target/nordic/nrf52.cfg]
}

set WORKAREASIZE 0x4000

$_TARGETNAME configure -rtos auto

$_TARGETNAME configure -event gdb-attach {
        echo "Debugger attaching: halting execution"
        reset halt
        gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}
